services:
  - type: web
    name: jyotir-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jyotir-db
          property: connectionString
      - key: ASTROLOGY_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://jyotir-web.onrender.com", "https://jyotir.builtbyanant.site"]'
      - key: PYTHON_VERSION
        value: "3.11.15"

  - type: web
    name: jyotir-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_API_URL
        value: https://jyotir-api.onrender.com

databases:
  - name: jyotir-db
    plan: free
    region: oregon
