services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jyotir
      POSTGRES_PASSWORD: jyotir
      POSTGRES_DB: jyotir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jyotir"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "9000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jyotir:jyotir@db:5432/jyotir
      ASTROLOGY_API_KEY: ${ASTROLOGY_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      APP_ENV: development
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_modules:
